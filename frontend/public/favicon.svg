<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sermokey">
  <!-- Standalone key mark: no backdrop, so the glyph sits directly on the
       browser tab / installed-icon surface and works on light or dark
       chrome. Terracotta matches the "k" of the sermokey wordmark. -->
  <g fill="#cc6333">
    <circle cx="15.2" cy="9.6" r="6.4" fill="none" stroke="#cc6333" stroke-width="3.6" />
    <rect x="13.4" y="14.4" width="3.6" height="13.6" rx="1.4" />
    <rect x="17" y="19" width="4.4" height="2.8" rx="1" />
    <rect x="17" y="23.4" width="3.2" height="2.6" rx="1" />
  </g>
</svg>
